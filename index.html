
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UK Postcode Search</title>
<style>
body{font:16px Arial;background:#f4f6f8;padding:20px}
main{max-width:600px;margin:auto;background:white;padding:20px;border-radius:10px}
input{width:100%;padding:13px;box-sizing:border-box;font-size:16px}
#suggestions{border:1px solid #ddd}
.item{padding:12px;cursor:pointer;border-bottom:1px solid #eee}
.item:hover{background:#eaf3ff}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f5;padding:15px}
</style>
</head>
<body>
<main>
<h2>UK Postcode Search</h2>

<input id="postcode" placeholder="Start typing a postcode...">
<div id="suggestions"></div>

<pre id="result">Postcode information will appear here.</pre>
</main>

<script>
const input=document.getElementById('postcode');
const suggestions=document.getElementById('suggestions');
const result=document.getElementById('result');

let timer;

input.addEventListener('input',()=>{
 clearTimeout(timer);
 const q=input.value.trim();

 suggestions.innerHTML='';
 if(q.length<2)return;

 timer=setTimeout(async()=>{
  try{
   const r=await fetch(
    'https://api.postcodes.io/postcodes/'+
    encodeURIComponent(q)+'/autocomplete'
   );
   const j=await r.json();

   suggestions.innerHTML='';
   (j.result||[]).forEach(p=>{
    const div=document.createElement('div');
    div.className='item';
    div.textContent=p;
    div.onclick=()=>selectPostcode(p);
    suggestions.appendChild(div);
   });
  }catch(e){
   suggestions.textContent='Unable to load suggestions.';
  }
 },300);
});

async function selectPostcode(p){
 input.value=p;
 suggestions.innerHTML='';
 result.textContent='Loading...';

 try{
  const r=await fetch(
   'https://api.postcodes.io/postcodes/'+
   encodeURIComponent(p)
  );
  const j=await r.json();

  if(!j.result){
   result.textContent='Postcode not found.';
   return;
  }

  const d=j.result;

  result.textContent=`
POSTCODE: ${d.postcode}

GEOGRAPHY
Latitude: ${d.latitude}
Longitude: ${d.longitude}
Easting: ${d.easting}
Northing: ${d.northing}

ADMINISTRATIVE
Parish: ${d.parish}
Ward: ${d.admin_ward}
District: ${d.admin_district}
County: ${d.admin_county}
Region: ${d.region}

COUNTRY: ${d.country}
`;
 }catch(e){
  result.textContent='API connection error.';
 }
}
</script>
</body>
</html>
