
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UK Postcode Lookup</title>
<style>
body{font:16px Arial;max-width:650px;margin:30px auto;padding:15px;background:#f4f6f8}
main{background:white;padding:22px;border-radius:12px}
input,button{padding:12px;font-size:16px}
input{width:65%;box-sizing:border-box}
button{cursor:pointer;background:#075eaa;color:white;border:0;border-radius:5px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f5;padding:15px;border-radius:6px}
h2{color:#075eaa}
</style>
</head>
<body>
<main>
<h2>UK Postcode Lookup</h2>
<p>Enter a UK postcode to retrieve geographical information.</p>

<input id="postcode" placeholder="e.g. S70 1AA">
<button onclick="lookup()">Search</button>

<pre id="result">Enter a postcode to begin.</pre>

<script>
async function lookup(){
 const p=document.getElementById('postcode').value.trim();
 const out=document.getElementById('result');

 if(!p){out.textContent='Please enter a postcode.';return;}

 out.textContent='Searching...';

 try{
  const r=await fetch(
   'https://api.postcodes.io/postcodes/'+encodeURIComponent(p)
  );
  const j=await r.json();

  if(!j.result){out.textContent='Postcode not found.';return;}

  const d=j.result;

  out.textContent=`
POSTCODE: ${d.postcode}

GEOGRAPHY
Latitude: ${d.latitude}
Longitude: ${d.longitude}
Easting: ${d.easting}
Northing: ${d.northing}

ADMINISTRATIVE
Parish: ${d.parish}
Ward: ${d.admin_ward}
District: ${d.admin_district}
County: ${d.admin_county}
Region: ${d.region}

COUNTRY: ${d.country}
NHS REGION: ${d.nhs_ha}
`;
 }catch(e){
  out.textContent='Error connecting to Postcodes.io';
 }
}
</script>
</main>
</body>
</html>
